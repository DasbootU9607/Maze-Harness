<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MazeBench Authoring Observatory</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="eyebrow">MAZEBENCH / LOCAL EVIDENCE</span><h1>Authoring Observatory</h1><p>Saved versions, recorded operations and test evidence. New tasks appear automatically.</p><label>Task <select id="runs"></select></label><span id="connection" role="status">Connecting</span></header>
<main><section class="overview"><h2 id="title">No task selected</h2><p id="summary"></p><p id="coverage"></p></section><div class="layout"><section><h2>Versions</h2><div id="versions"></div><h2>Timeline</h2><div id="timeline"></div></section><section><h2 id="version-title">Saved map</h2><canvas id="map" width="560" height="560"></canvas><p id="diff"></p><h2>Tests for this version</h2><div id="tests"></div><h2>Design summaries</h2><div id="notes"></div><h2>Resources</h2><div id="resources"></div></section></div></main>
<dialog id="evidence"><button id="close">Close</button><h2>Saved evidence</h2><pre id="evidence-text"></pre></dialog><script src="app.js"></script></body></html>
