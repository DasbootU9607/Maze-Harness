name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'site/**'
      - 'scripts/*site*.cjs'
      - 'scripts/*authoring*.cjs'
      - 'scripts/*process*.cjs'
      - 'tools/authoring-observatory/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'site/**'
      - 'scripts/*site*.cjs'
      - 'scripts/*authoring*.cjs'
      - 'scripts/*process*.cjs'
      - 'tools/authoring-observatory/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all rooms, saved routes, and provenance
        run: node scripts/check-site.cjs
      - name: Verify incremental skill discovery
        run: node scripts/test-site-sync.cjs
      - name: Verify candidate screenshot bindings
        run: node scripts/test-process-thumbnails.cjs
      - name: Verify authoring recorder and public evidence projection
        run: |
          node --test tools/authoring-observatory/tests/*.test.cjs
          node scripts/test-authoring-integration.cjs
          node scripts/test-authoring-process.cjs
          node scripts/test-process-uncertain-history.cjs
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
